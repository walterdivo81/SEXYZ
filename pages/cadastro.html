<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17141c"><meta name="description" content="SEXYZ — conexões de verdade. Exclusivo para maiores de 18 anos.">
<title>Criar conta | SEXYZ</title><link rel="stylesheet" href="../assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer src="../assets/config.js"></script><script defer src="../assets/app.js"></script>
</head><body data-page="cadastro"><main id="app" class="wrap">
<section class="form-card card"><div class="eyebrow">Comece por aqui</div><h1>Criar sua conta</h1><p class="muted">Preencha seus dados para iniciar seu perfil no SEXYZ.</p>
<form id="signup-form">
<div class="field"><label>Nome ou apelido *</label><input name="nome" required maxlength="60" autocomplete="name" placeholder="Como deseja ser chamado?"></div>
<div class="field"><label>E-mail *</label><input name="email" type="email" required autocomplete="email" placeholder="voce@email.com"></div>
<div class="field"><label>Senha *</label><input name="senha" type="password" required minlength="8" autocomplete="new-password" placeholder="Mínimo de 8 caracteres"></div>
<div class="field"><label>Data de nascimento *</label><input name="data_nascimento" type="date" required max="2008-11-07"></div>
<div class="notice">A plataforma é exclusiva para maiores de 18 anos. A idade é validada antes do cadastro.</div>
<div class="form-grid"><div class="field"><label>Gênero</label><select name="genero"><option value="">Selecione</option><option value="Homem" >Homem</option><option value="Mulher" >Mulher</option><option value="Não binário" >Não binário</option><option value="Prefiro não informar" >Prefiro não informar</option></select></div>
<div class="field"><label>Orientação</label><select name="orientacao"><option value="">Selecione</option><option value="Heterossexual" >Heterossexual</option><option value="Homossexual" >Homossexual</option><option value="Bissexual" >Bissexual</option><option value="Pansexual" >Pansexual</option><option value="Assexual" >Assexual</option><option value="Outra" >Outra</option><option value="Prefiro não informar" >Prefiro não informar</option></select></div></div>
<div class="field"><label>Desejo encontrar</label><select name="desejo"><option value="Homens e mulheres" >Homens e mulheres</option><option value="Homens" >Homens</option><option value="Mulheres" >Mulheres</option><option value="Outras identidades" >Outras identidades</option></select></div>
<div class="form-grid"><div class="field"><label>Cidade</label><input name="cidade" placeholder="Sua cidade"></div><div class="field"><label>Estado</label><select name="estado"><option value="">Selecione</option><option value="AC" >AC</option><option value="AL" >AL</option><option value="AP" >AP</option><option value="AM" >AM</option><option value="BA" >BA</option><option value="CE" >CE</option><option value="DF" >DF</option><option value="ES" >ES</option><option value="GO" >GO</option><option value="MA" >MA</option><option value="MT" >MT</option><option value="MS" >MS</option><option value="MG" >MG</option><option value="PA" >PA</option><option value="PB" >PB</option><option value="PR" >PR</option><option value="PE" >PE</option><option value="PI" >PI</option><option value="RJ" >RJ</option><option value="RN" >RN</option><option value="RS" >RS</option><option value="RO" >RO</option><option value="RR" >RR</option><option value="SC" >SC</option><option value="SP" >SP</option><option value="SE" >SE</option><option value="TO" >TO</option></select></div></div>
<label class="checkline"><input type="checkbox" name="aceite" value="sim" required><span>Confirmo que tenho 18 anos ou mais e concordo com os termos de uso e a política de privacidade.</span></label>
<div id="feedback" class="alert"></div><button class="btn" style="width:100%">Criar conta</button></form>
<p class="muted small">Já tem conta? <a href="login.html" style="color:var(--rose)">Entrar</a></p></section></main></body></html>
